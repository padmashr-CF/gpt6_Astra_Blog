<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" style="background:#0a0a0a; font-family:sans-serif;">
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  
  <rect x="100" y="50" width="600" height="540" rx="12" fill="#111" stroke="#333" stroke-width="2"/>
  <text x="400" y="100" fill="#fff" font-size="24" font-weight="bold" text-anchor="middle">The Autonomy Test: GPT-6 Astra</text>
  
  <g transform="translate(150, 150)">
    <!-- Items -->
    <text x="0" y="20" fill="#ddd" font-size="16">1. Understands the goal</text>
    <text x="400" y="20" fill="#00C853" font-size="16" font-weight="bold">✓ Strong</text>
    <line x1="0" y1="35" x2="500" y2="35" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="60" fill="#ddd" font-size="16">2. Plans the work</text>
    <text x="400" y="60" fill="#00C853" font-size="16" font-weight="bold">✓ Strong</text>
    <line x1="0" y1="75" x2="500" y2="75" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="100" fill="#ddd" font-size="16">3. Uses tools</text>
    <text x="400" y="100" fill="#00C853" font-size="16" font-weight="bold">✓ Strong</text>
    <line x1="0" y1="115" x2="500" y2="115" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="140" fill="#ddd" font-size="16">4. Executes actions</text>
    <text x="400" y="140" fill="#00C853" font-size="16" font-weight="bold">✓ Strong</text>
    <line x1="0" y1="155" x2="500" y2="155" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="180" fill="#ddd" font-size="16">5. Handles failure</text>
    <text x="400" y="180" fill="#FFB300" font-size="16" font-weight="bold">◐ Moderate</text>
    <line x1="0" y1="195" x2="500" y2="195" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="220" fill="#ddd" font-size="16">6. Verifies results</text>
    <text x="400" y="220" fill="#FFB300" font-size="16" font-weight="bold">◐ Moderate</text>
    <line x1="0" y1="235" x2="500" y2="235" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="260" fill="#ddd" font-size="16">7. Recovers independently</text>
    <text x="400" y="260" fill="#FFB300" font-size="16" font-weight="bold">◐ Moderate</text>
    <line x1="0" y1="275" x2="500" y2="275" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="300" fill="#ddd" font-size="16">8. Knows when to ask for help</text>
    <text x="400" y="300" fill="#FF5252" font-size="16" font-weight="bold">○ Limited</text>
    <line x1="0" y1="315" x2="500" y2="315" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="340" fill="#ddd" font-size="16">9. Respects authorization boundaries</text>
    <text x="400" y="340" fill="#FFB300" font-size="16" font-weight="bold">◐ Moderate</text>
    <line x1="0" y1="355" x2="500" y2="355" stroke="#222" stroke-width="1"/>
    
    <text x="0" y="380" fill="#ddd" font-size="16">10. Completes long-horizon tasks</text>
    <text x="400" y="380" fill="#FFB300" font-size="16" font-weight="bold">◐ Moderate</text>
  </g>
</svg>